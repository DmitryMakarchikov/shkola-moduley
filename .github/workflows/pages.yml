# онлайн-версия на GitHub Pages: при каждой отправке в main — тесты, сборка сайта и публикация.
# Без сервера платформа работает автономно: данные хранятся в браузере (IndexedDB)
name: Онлайн-версия

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Модульные тесты
        run: npm test
      - name: Проверка типов
        run: npm run typecheck
      - name: Сборка сайта
        run: npm run build
      # сжатые копии нужны только своему серверу
      - run: find apps/web/dist -name '*.br' -delete -o -name '*.gz' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
